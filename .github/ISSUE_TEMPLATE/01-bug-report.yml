name: Bug report
description: Report a defect, regression, or behavior that does not match the expected result.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: behavior
    attributes:
      label: Current behavior
      description: What actually happened. Include the action, error message, or a log snippet.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Start from opening the app or calling an API, and list the steps in order.
      placeholder: |
        1. Open a conversation and go to ...
        2. Send or choose ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version or commit, where it runs (local or the remote server), and the client or API involved.
